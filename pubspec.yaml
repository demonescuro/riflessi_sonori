name: riflessi_sonori
description: "Allenamento dei riflessi con stimoli sonori."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/riflessi_simbolo.png"
  adaptive_icon_background: "#101B30"
  adaptive_icon_foreground: "assets/branding/riflessi_simbolo.png"
  adaptive_icon_foreground_inset: 16

flutter_native_splash:
  android: true
  ios: false
  web: false

  color: "#101B30"
  color_dark: "#101B30"
  image: "assets/branding/riflessi_simbolo.png"
  image_dark: "assets/branding/riflessi_simbolo.png"
  android_gravity: center

  android_12:
    color: "#101B30"
    color_dark: "#101B30"
    icon_background_color: "#101B30"
    icon_background_color_dark: "#101B30"